!DOCTYPE html
<html>
    <head>
        <title>Facebook Login</title>
    </head>
    <body>
        <div>
            <!--Logo FB -->
            <div></div>
            <!-- Đường kẻ ngang -->
            <div></div>

            <div>
                <div>
                    <span>Log in to Facebook</span>
                </div>
                <div>
                    <form id="login_form" method="POST">
                        <div>
                            <div>
                                <!--Input email or mobile number -->
                                <div>
                                    <input
                                        dir="ltr"
                                        type="text"
                                        name="email"
                                        value
                                    />
                                    <label
                                        >Email address or mobile number</label
                                    >
                                </div>
                                <!--Input password -->
                                <div>
                                    <input
                                        dir="ltr"
                                        type="password"
                                        name="password"
                                        value
                                    />
                                    <label>Password</label>
                                </div>
                                <!--Button Login -->
                                <div aria-label="Log in" role="button">
                                    <span>Login</span>
                                </div>
                                <!--Forgotten password -->
                                <div>
                                    <a href="#">
                                        <span>Forgotten password?</span>
                                    </a>
                                </div>
                                <!--Create new account -->
                                <div>
                                    <a href="#">
                                        <span>Create new account</span>
                                    </a>
                                </div>
                                <!-- Meta image -->
                                <div></div>
                            </div>
                            <div hidden>
                                <input type="submit" />
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <!-- Đường kẻ ngang -->
            <div></div>
            <div>
                <!-- Đường kẻ ngang -->
                <div></div>
                <div>
                    <!-- Ngôn ngữ -->
                    <div>
                        <div>
                            <span>
                                <a href="#" role="link"> English (UK) </a>
                            </span>
                        </div>
                        <div>
                            <span>
                                <a href="#" role="link"> Tiếng Việt </a>
                            </span>
                        </div>
                        <div>
                            <span>
                                <a href="#" role="link"> 中文(台灣) </a>
                            </span>
                        </div>
                        <div>
                            <span>
                                <a href="#" role="link"> 한국어 </a>
                            </span>
                        </div>
                        <div>
                            <span>
                                <a href="#" role="link"> 日本語 </a>
                            </span>
                        </div>
                        <div>
                            <span>
                                <a href="#" role="link"> Français (France) </a>
                            </span>
                        </div>
                        <div>
                            <span>
                                <a href="#" role="link"> ภาษาไทย </a>
                            </span>
                        </div>
                        <div>
                            <span>
                                <a href="#" role="link"> More languages… </a>
                            </span>
                        </div>
                    </div>
                    <!-- Chức năng và liên kết -->
                    <div></div>
                    <!-- Copyright -->
                    <div>
                        <span>Meta © 2026</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
